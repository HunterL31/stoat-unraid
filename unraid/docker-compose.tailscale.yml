name: stoat

# =============================================================================
# STOAT CHAT - UNRAID DOCKER TEMPLATE (TAILSCALE EDITION)
# =============================================================================
# Self-hosted chat platform with its OWN Tailscale identity
# 
# SECURITY: This container has its own Tailscale node identity, completely
# separate from your Unraid server. When you share access to Stoat, you're
# ONLY sharing access to this chat service, not your whole server.
#
# SETUP:
# 1. Get a Tailscale auth key from https://login.tailscale.com/admin/settings/keys
#    - Use a reusable key if you want the container to reconnect after restarts
#    - Enable "Ephemeral" if you want the node to auto-remove when stopped
# 2. Run: ./unraid/setup-unraid.sh stoat.your-tailnet.ts.net --tailscale
# 3. Edit unraid/.env and set: TAILSCALE_AUTHKEY=tskey-auth-xxxxx
# 4. Start: docker compose -f unraid/docker-compose.tailscale.yml up -d
#
# SHARING:
# - Go to https://login.tailscale.com/admin/machines
# - Find "stoat" in your machine list
# - Click Share → Share with others
# - They get access to Stoat only, not your Unraid server!
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Tailscale: Isolated network endpoint for Stoat
  # This container gets its OWN Tailscale identity separate from Unraid
  # ---------------------------------------------------------------------------
  tailscale:
    image: tailscale/tailscale:latest
    container_name: stoat-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-stoat}
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      # Prevent this container from accessing other Tailscale nodes
      - TS_EXTRA_ARGS=--accept-routes=false
    volumes:
      - ${APPDATA_PATH:-/mnt/user/appdata}/stoat/tailscale:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    labels:
      net.unraid.docker.managed: "composeman"
      net.unraid.docker.icon: "https://tailscale.com/files/favicon-32x32.png"

  # ---------------------------------------------------------------------------
  # MongoDB: Primary Database
  # ---------------------------------------------------------------------------
  database:
    image: docker.io/mongo:latest
    container_name: stoat-database
    restart: unless-stopped
    volumes:
      - ${APPDATA_PATH:-/mnt/user/appdata}/stoat/mongodb:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Redis (KeyDB): Event message broker & KV store
  # ---------------------------------------------------------------------------
  redis:
    image: docker.io/eqalpha/keydb:latest
    container_name: stoat-redis
    restart: unless-stopped
    volumes:
      - ${APPDATA_PATH:-/mnt/user/appdata}/stoat/redis:/data
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # RabbitMQ: Internal message broker
  # ---------------------------------------------------------------------------
  rabbit:
    image: docker.io/rabbitmq:4
    container_name: stoat-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbituser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-rabbitpass}
    volumes:
      - ${APPDATA_PATH:-/mnt/user/appdata}/stoat/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # MinIO: S3-compatible storage server for file uploads
  # ---------------------------------------------------------------------------
  minio:
    image: docker.io/minio/minio:latest
    container_name: stoat-minio
    command: server /data
    volumes:
      - ${APPDATA_PATH:-/mnt/user/appdata}/stoat/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioautumn}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioautumn}
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Caddy: Reverse proxy / Web server (internal only with Tailscale)
  # ---------------------------------------------------------------------------
  caddy:
    image: docker.io/caddy:latest
    container_name: stoat-caddy
    restart: unless-stopped
    env_file: .env.web
    # No exposed ports - Tailscale handles external access
    network_mode: service:tailscale
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APPDATA_PATH:-/mnt/user/appdata}/stoat/caddy-data:/data
      - ${APPDATA_PATH:-/mnt/user/appdata}/stoat/caddy-config:/config
    depends_on:
      - tailscale
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # API Server: Main Stoat backend
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/revoltchat/server:20250930-2
    container_name: stoat-api
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - ./Revolt.toml:/Revolt.toml:ro
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Events: WebSocket service for real-time events
  # ---------------------------------------------------------------------------
  events:
    image: ghcr.io/revoltchat/bonfire:20250930-2
    container_name: stoat-events
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./Revolt.toml:/Revolt.toml:ro
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Web: Frontend web application
  # ---------------------------------------------------------------------------
  web:
    image: ghcr.io/revoltchat/client:master
    container_name: stoat-web
    restart: unless-stopped
    env_file: .env.web
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Autumn: File server for uploads/attachments
  # ---------------------------------------------------------------------------
  autumn:
    image: ghcr.io/revoltchat/autumn:20250930-2
    container_name: stoat-autumn
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    volumes:
      - ./Revolt.toml:/Revolt.toml:ro
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # January: Metadata and image proxy
  # ---------------------------------------------------------------------------
  january:
    image: ghcr.io/revoltchat/january:20250930-2
    container_name: stoat-january
    volumes:
      - ./Revolt.toml:/Revolt.toml:ro
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Gifbox: Tenor GIF proxy
  # ---------------------------------------------------------------------------
  gifbox:
    image: ghcr.io/revoltchat/gifbox:20250930-2
    container_name: stoat-gifbox
    volumes:
      - ./Revolt.toml:/Revolt.toml:ro
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Crond: Scheduled task daemon
  # ---------------------------------------------------------------------------
  crond:
    image: ghcr.io/revoltchat/crond:20250930-2
    container_name: stoat-crond
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./Revolt.toml:/Revolt.toml:ro
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Pushd: Push notification daemon
  # ---------------------------------------------------------------------------
  pushd:
    image: ghcr.io/revoltchat/pushd:20250930-2
    container_name: stoat-pushd
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbit:
        condition: service_healthy
    volumes:
      - ./Revolt.toml:/Revolt.toml:ro
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: "composeman"

  # ---------------------------------------------------------------------------
  # Create Buckets: One-time initialization for MinIO
  # ---------------------------------------------------------------------------
  createbuckets:
    image: docker.io/minio/mc:latest
    container_name: stoat-createbuckets
    depends_on:
      - minio
    environment:
      MINIO_USER: ${MINIO_USER:-minioautumn}
      MINIO_PASS: ${MINIO_PASS:-minioautumn}
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 $${MINIO_USER} $${MINIO_PASS};
        echo 'Waiting for MinIO...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads --ignore-existing;
      exit 0;
      "
    labels:
      net.unraid.docker.managed: "composeman"

